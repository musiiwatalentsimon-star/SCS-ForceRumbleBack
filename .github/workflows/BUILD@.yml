name: Build ForceRumbleBack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64 with VS2022 v143
        run: |
          msbuild twinTurboRumbler.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:PlatformToolset=v143

      - name: Upload ForceRumbleBack DLL
        uses: actions/upload-artifact@v4
        with:
          name: ForceRumbleBack-x64
          path: |
            **/x64/Release/ForceRumbleBack.dll
